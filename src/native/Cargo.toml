[package]
name = "flow-native"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# The local NSH checkout with the window-model v2 work (the fork's `main`
# once it is pushed): an input under the canvas's scaled camera draws,
# places its caret and takes clicks where it shows.
nsh-core = { path = "../../../nsh-pr/crates/nsh-core" }
# Synchronous SeaORM. `rusqlite` is the SQLite driver; the direct dependency
# enables the bundled SQLite build (including FTS5 and RTree).
sea-orm-sync = { version = "2.0.4", default-features = false, features = [
  "sync",
  "macros",
  "rusqlite",
] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde_json = "1.0"
sha2 = "0.10"
# The package importer reads a user-supplied .zip (ADR 0008). Only stored and
# deflate entries are accepted; the default features would pull encryption and
# extra codecs the importer refuses. zlib-rs is the pure-Rust flate2 backend,
# selected here instead of inheriting another crate's default backend.
zip = { version = "9.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
