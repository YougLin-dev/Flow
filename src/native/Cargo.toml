[package]
name = "flow-native"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# Our fork's `main`, synced from longbridge/nsh: an input under the canvas's
# scaled camera draws, places its caret and takes clicks where it shows.
# The lock pins the resolved commit; `cargo update -p nsh-core` follows a
# newer `main`.
nsh-core = { git = "https://github.com/YougLin-dev/nsh.git", branch = "main" }
# Synchronous SeaORM. `rusqlite` is the SQLite driver; the direct dependency
# enables the bundled SQLite build (including FTS5 and RTree).
sea-orm-sync = { version = "2.0.4", default-features = false, features = [
  "sync",
  "macros",
  "rusqlite",
] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde_json = "1.0"
sha2 = "0.10"
