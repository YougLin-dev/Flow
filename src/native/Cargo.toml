[package]
name = "flow-native"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = { git = "https://github.com/YougLin-dev/nsh.git", rev = "70017242acac6887dbe89f93074e1fbbc87d76b7" }
# Synchronous SeaORM. `rusqlite` is the SQLite driver; the direct dependency
# enables the bundled SQLite build (including FTS5 and RTree).
sea-orm-sync = { version = "2.0.4", default-features = false, features = [
  "sync",
  "macros",
  "rusqlite",
] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde_json = "1.0"
