name: Build pinned NSH
description: Builds the NSH CLI from the fork commit the app's Rust core pins.

# The project declaration selects the exact fork revision. CI builds that
# source instead of downloading a newer (or older) CLI.
inputs:
  release:
    description: Build the release CLI (`true`) instead of the debug one
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up the Windows build
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
        echo 'RUST_MIN_STACK=268435456' >> "$GITHUB_ENV"

    - name: Fetch the pinned NSH commit
      shell: bash
      run: |
        NSH_REV=$(bun -e 'const pin = await Bun.file("src/nsh.json").json(); process.stdout.write(pin.toolchain.nsh.version.slice(4));')
        NSH_REPOSITORY=$(bun -e 'const pin = await Bun.file("src/nsh.json").json(); console.log(pin.toolchain.nsh.repository);')
        [[ "$NSH_REV" =~ ^[0-9a-f]{40}$ ]] || {
          echo '$NSH_REV is not a full, lowercase Git revision' >&2
          exit 1
        }
        [[ "$NSH_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
          echo 'Invalid NSH repository in src/nsh.json' >&2
          exit 1
        }
        echo "FLOW_NSH_REV=$NSH_REV" >> "$GITHUB_ENV"
        rm -rf "$RUNNER_TEMP/nsh"
        git init --quiet "$RUNNER_TEMP/nsh"
        git -C "$RUNNER_TEMP/nsh" remote add origin "https://github.com/$NSH_REPOSITORY"
        git -C "$RUNNER_TEMP/nsh" fetch --quiet --depth 1 origin "$NSH_REV"
        git -C "$RUNNER_TEMP/nsh" checkout --quiet --detach FETCH_HEAD
        test "$(git -C "$RUNNER_TEMP/nsh" rev-parse HEAD)" = "$NSH_REV"
        git -C "$RUNNER_TEMP/nsh" remote get-url origin

    - name: Build the CLI
      shell: bash
      env:
        NSH_RELEASE: ${{ inputs.release }}
        # The checkout's rust-toolchain.toml lists the mobile targets only the
        # NSH release builds; stay on the runner's stable toolchain. The env
        # line also keeps later `nsh package` cargo builds on stable.
        RUSTUP_TOOLCHAIN: stable
      run: |
        echo 'RUSTUP_TOOLCHAIN=stable' >> "$GITHUB_ENV"
        if [ "$NSH_RELEASE" = "true" ]; then
          cargo build --locked --manifest-path "$RUNNER_TEMP/nsh/Cargo.toml" -p nsh-cli --release
          bin="$RUNNER_TEMP/nsh/target/release"
        else
          cargo build --locked --manifest-path "$RUNNER_TEMP/nsh/Cargo.toml" -p nsh-cli
          bin="$RUNNER_TEMP/nsh/target/debug"
        fi
        echo "$bin" >> "$GITHUB_PATH"
        if [ "$RUNNER_OS" = "Windows" ]; then
          "$bin/nsh.exe" --version
        else
          "$bin/nsh" --version
        fi
