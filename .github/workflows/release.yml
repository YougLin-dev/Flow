name: Installers

# Native installers embed the target platform's runtime, so each OS builds
# its own. Run manually, or push a tag such as v1.0.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/native -> target

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(bun -e "console.log(require('./src/nsh.json').version)")
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME does not match src/nsh.json version v$version" >&2
            exit 1
          }

      # nshw builds the declared NSH source: QuickJS is C, and `nshw package`
      # also builds this OS's release runner, which links GTK 4 and GStreamer
      # on Linux.
      - name: Install the NSH build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      # The installer embeds the runtime built from the same declared checkout,
      # not a runtime downloaded from nsh.dev.
      - uses: ./.github/actions/nshw

      # Build the declared CLI, host and app once, outside the gate step.
      - run: nshw toolchain prefetch

      - run: bun install --frozen-lockfile

      # Never build an installer from a tree that fails the gate.
      - run: bun run check
      - run: bun run test

      # Signing is optional: without the secret, macOS builds are ad hoc
      # signed (see docs/packaging.md).
      - run: bun run package
        env:
          FLOW_MACOS_SIGNING_IDENTITY: ${{ secrets.FLOW_MACOS_SIGNING_IDENTITY }}
          # appimagetool is an AppImage itself; extract it instead of needing FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - uses: actions/upload-artifact@v4
        with:
          name: flow-${{ matrix.os }}
          path: .nsh/out/installers/*
          if-no-files-found: error
