name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # setup-bun reads packageManager from package.json.
      - uses: oven-sh/setup-bun@v2

      # The mixed app's src/native crate and the check gate need Cargo.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/native -> target

      # nshw builds the declared NSH source: QuickJS is C, bindgen needs
      # libclang, and the Linux desktop runtime links GTK 4 and GStreamer.
      - name: Install the NSH build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: ./.github/actions/nshw

      # Build the declared CLI, host and app once, outside a gate step.
      - run: nshw toolchain prefetch

      - run: bun install --frozen-lockfile

      # Format, lint, type-check and file names.
      - run: bun run check

      # Headless, so the result does not depend on the runner's display.
      - run: bun run test
