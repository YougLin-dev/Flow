name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # setup-bun reads packageManager from package.json.
      - uses: oven-sh/setup-bun@v2

      # The mixed app's src/native crate and the check gate need Cargo.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/native -> target

      # The pinned NSH is built from source: QuickJS is C, and bindgen needs
      # libclang on Linux.
      - name: Install the NSH build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      # The window-model v2 APIs are not in an upstream release yet, so build
      # the CLI from the same commit as the Rust core instead of the nightly.
      - uses: ./.github/actions/nsh

      - run: bun install --frozen-lockfile

      # Format, lint, type-check and file names.
      - run: bun run check

      # Headless, so the result does not depend on the runner's display.
      - run: bun run test
