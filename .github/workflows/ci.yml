name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # setup-bun reads packageManager from package.json.
      - uses: oven-sh/setup-bun@v2

      # The mixed app's src/native crate and the check gate need Cargo.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/native -> target

      # CI takes the NSH nightly: the app uses JS APIs (wakeCount, App.wake)
      # that are newer than the latest stable release. The Rust core stays
      # pinned by src/native/Cargo.lock.
      - name: Install NSH nightly (macOS and Linux)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh -s -- --nightly
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nsh" --version

      - name: Install NSH nightly (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NSH_VERSION = 'nightly'
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$env:LOCALAPPDATA\nsh\bin\nsh.exe" --version

      - run: bun install --frozen-lockfile

      # Format, lint, type-check and file names.
      - run: bun run check

      # Headless, so the result does not depend on the runner's display.
      - run: bun run test
